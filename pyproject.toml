[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "freecad-rotorforge"
authors = [{name = "Michael Struggl"}]
maintainers = [{name = "Michael Struggl"}]
dynamic = ["version"]
description = "RotorForge Drone Frame Editor for FreeCAD"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# FreeCAD supplies Part, FreeCADGui and PySide. Do not install replacements
# from PyPI into FreeCAD's Python environment.

[tool.hatch.version]
path = "freecad/rotorforge/version.py"

[tool.hatch.build.targets.wheel]
packages = ["freecad", "rotorforge"]
# Keep the bundled manual available in wheel installations as well.
[tool.hatch.build.targets.wheel.force-include]
"RotorForge_Help.pdf" = "freecad/rotorforge/resources/docs/RotorForge_Help.pdf"

[tool.hatch.build.targets.sdist]
include = ["/freecad", "/rotorforge", "/package.xml", "/Launch_RotorForge.FCMacro", "/RotorForge_Installation.pdf", "/RotorForge_Help.pdf", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[project.urls]
"Maintainer profile" = "https://www.diyfpv.com/profile/M4R5_FPV"
